# Wearhouse v2 migrations. Prefer the release command: `wearhouse migrate --environment <env>`.
# Direct use: alembic -x environment=development -x runtime_role=wearhouse_runtime upgrade head
# (sqlalchemy.url is supplied by the CLI from WEARHOUSE_MIGRATION_DATABASE_URL).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
