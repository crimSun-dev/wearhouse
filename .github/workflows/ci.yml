name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-neon-adapter:
    name: Legacy Neon Function scoring parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: legacy/neon/package-lock.json
      - run: npm ci --prefix legacy/neon
      - run: npm test --prefix legacy/neon

  test-postgres-and-sqlite:
    name: Legacy tests (SQLite + PostgreSQL, Ubuntu)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: legacy/python
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/dw_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: legacy/python/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
      - name: CLI smoke test (Phase 1 deliverable)
        run: python -m app.cli recommend --rain --occasion campus
      - name: Legacy Pages artifact policy (build + non-mutating deep-link smoke)
        working-directory: .
        run: |
          npm ci --prefix legacy/web
          python tools/build_legacy_pages.py --out ci-pages
          python tools/smoke_legacy_pages.py ci-pages
      - name: Secret check (no Neon credentials committed)
        working-directory: .
        run: |
          if git grep -nE "postgres(ql)?://[^:@/ ]+:[^@/ ]+@[^ ]*neon\.tech" -- . ':!*.md'; then
            echo "A Neon connection string with a password is committed. Rotate it." && exit 1
          fi

  test-windows:
    name: Legacy tests (SQLite, Windows — the demo laptop OS)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: legacy/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: legacy/python/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  measure:
    name: Legacy measure.py (offline, Ch 15 metrics)
    runs-on: ubuntu-latest
    needs: test-postgres-and-sqlite
    defaults:
      run:
        working-directory: legacy/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: legacy/python/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python measure.py --out-dir ../../ci-results --report ../../ci-results/RESULTS.md
      - run: cat ../../ci-results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measure-results
          path: ci-results/

  # ---------------------------------------------------------------- Wearhouse v2 (apps/api)
  # Independent of the legacy jobs above: own PostgreSQL service container per job, own venv/lockfiles,
  # no shared writable database state. Pages keeps deploying legacy v1 only.
  v2-tests:
    name: v2 API tests (PostgreSQL 17, migrations, boundaries, races)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WEARHOUSE_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: pip install -r apps/api/requirements-dev.lock && pip install --no-deps -e apps/api
      - name: Migrations, constraints, identity, ownership, races, contracts, boundaries
        working-directory: apps/api
        run: python -m pytest -q -rs
      - name: Repeatable migration on a fresh database (release command)
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE ROLE wearhouse_runtime LOGIN PASSWORD 'ci'" -c "CREATE DATABASE wearhouse_ci"
          for i in 1 2; do WEARHOUSE_MIGRATION_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/wearhouse_ci \
            python -m wearhouse.bootstrap.cli migrate --environment test --runtime-role wearhouse_runtime; done

  v2-contracts:
    name: v2 contract drift (OpenAPI + TypeScript, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: pip install -r apps/api/requirements.lock && pip install --no-deps -e apps/api
      - run: npm ci --prefix packages/contracts
      - name: Contract drift (fails with regeneration instructions)
        run: python tools/contracts.py check
      - run: npm run check --prefix packages/contracts

  v2-container:
    name: v2 container build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wearhouse-api:ci apps/api
      - name: Image refuses to start without configuration
        run: |
          if docker run --rm wearhouse-api:ci; then echo "started without config" && exit 1; fi

  # ---------------------------------------------------------------- add-wearhouse-accounts (temporary pages)
  accounts-pages:
    name: Account pages (unit, typecheck, build guard, e2e against local v2)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WEARHOUSE_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: apps/web/account-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: v2 API venv for the e2e harness
        working-directory: apps/api
        run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.lock && .venv/bin/pip install --no-deps -e .
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Production build + guard (no e2e fake, no legacy code)
        run: npm run build
        env:
          VITE_NEON_AUTH_URL: https://ep-ci-placeholder.aws.neon.tech/neondb/auth
      - name: Guard trips on the e2e build
        run: npm run build:e2e && ! node scripts/check-build.mjs dist-e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  web:
    name: Wearhouse web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run check:size
      - run: npm run check:coverage
